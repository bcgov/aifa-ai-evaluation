# Rendered by the nginx image's envsubst step (see frontend/Dockerfile).
# ACA: all containers share one network namespace, so upstreams default to 127.0.0.1.
# Compose: set PYRIT_UPSTREAM=backend:8000 and PROMPTFOO_UPSTREAM=promptfoo:8001.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;

    # Re-resolve upstream names so recreated Compose containers keep working.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $pyrit_upstream ${PYRIT_UPSTREAM};
    set $promptfoo_upstream ${PROMPTFOO_UPSTREAM};

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Promptfoo container: more specific prefix, so it wins over /api/.
    location /api/promptfoo/ {
        proxy_pass http://$promptfoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Run-Token "${PROMPTFOO_RUN_TOKEN}";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # PyRIT container. Keep the original request URI (/api/...) so FastAPI routes match exactly.
    location /api/ {
        proxy_pass http://$pyrit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }
}
