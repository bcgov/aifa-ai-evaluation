name: Reusable Azure App Service deployment

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      app_env:
        required: false
        type: string
        default: dev
      command:
        required: false
        type: string
        default: apply
      terraform_directory:
        required: false
        type: string
        default: infra
      subscription_id:
        required: false
        type: string
        default: ""
      tenant_id:
        required: false
        type: string
        default: ""
      resource_group_name:
        required: false
        type: string
        default: rg-aifa-ai-evaluation-dev
      app_name:
        required: false
        type: string
        default: aifa-ai-evaluation-dev
      location:
        required: false
        type: string
        default: eastus
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID || inputs.subscription_id }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID || inputs.tenant_id }}
      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_location: ${{ inputs.location }}
      TF_VAR_resource_group_name: ${{ inputs.resource_group_name }}
      TF_VAR_app_name: ${{ inputs.app_name }}
      TF_VAR_app_env: ${{ inputs.app_env }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || inputs.subscription_id }}
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || inputs.tenant_id }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || inputs.subscription_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform validate

      - name: Terraform ${{ inputs.command }}
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          terraform ${{ inputs.command }} -auto-approve \
            -var="app_env=${{ inputs.app_env }}" \
            -var="location=${{ inputs.location }}" \
            -var="resource_group_name=${{ inputs.resource_group_name }}" \
            -var="app_name=${{ inputs.app_name }}" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID || inputs.subscription_id }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID || inputs.tenant_id }}"

      - name: Build deployment artifact
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          mkdir -p deploy
          cp -R . deploy/app
          mkdir -p deploy/app/.azure || true
          python - <<'PY'
          from pathlib import Path
          src = Path('deploy/app')
          wheel_dir = src / 'dist'
          if wheel_dir.exists():
              for p in wheel_dir.iterdir():
                  if p.suffix == '.whl':
                      print(f'Found wheel: {p.name}')
          PY

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          package: deploy/app
