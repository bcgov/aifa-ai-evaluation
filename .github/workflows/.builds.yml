name: Build Containers

on:
  workflow_call:
    inputs:
      tags:
        description: 'Tags to apply to the built containers multiline, separated by newlines'
        required: true
        type: string
      build_context:
        description: 'Build context path (default .)'
        required: false
        type: string
        default: '.'
      build_file:
        description: 'Dockerfile path (default ./Dockerfile)'
        required: false
        type: string
        default: './Dockerfile'
permissions:
  id-token: write
  contents: write
  packages: write
jobs:
  builds:
    name: Builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images (buildx)
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          BUILD_FILE: ${{ inputs.build_file }}
          REPO_BASE: ghcr.io/${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          BUILD_CONTEXT="${BUILD_CONTEXT:-.}"
          BUILD_FILE="${BUILD_FILE:-./Dockerfile}"

          if [ -z "$BUILD_CONTEXT" ]; then
            BUILD_CONTEXT="."
          fi
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE="./Dockerfile"
          fi

          # Normalize tags, deduplicate and add run number as fallback.
          declare -a tag_array=()
          while IFS= read -r tag; do
            tag="${tag//[$'\r\n']/}"
            tag="$(echo "$tag" | xargs)"
            if [ -n "$tag" ]; then
              tag_array+=("$tag")
            fi
          done <<< "$TAGS"
          tag_array+=("run-${{ github.run_number }}")

          declare -A seen=()
          unique_tags=()
          for tag in "${tag_array[@]}"; do
            if [ -n "$tag" ] && [[ -z "${seen[$tag]:-}" ]]; then
              seen["$tag"]=1
              unique_tags+=("$tag")
            fi
          done

          for service in pyrit frontend promptfoo; do
            case "$service" in
              pyrit)
                service_context="."
                service_file="aifa_pyrit/Dockerfile"
                package_name="aifa-ai-evaluation-pyrit"
                ;;
              frontend)
                service_context="./frontend-common"
                service_file="./frontend-common/Dockerfile"
                package_name="aifa-ai-evaluation-frontend"
                ;;
              promptfoo)
                service_context="./promptfoo"
                service_file="./promptfoo/Dockerfile"
                package_name="aifa-ai-evaluation-promptfoo"
                ;;
            esac

            for tag in "${unique_tags[@]}"; do
              image="${REPO_BASE}/${package_name}:${tag}"
              echo "Building and pushing: $image"
              docker buildx build --push --platform linux/amd64 --tag "$image" --file "$service_file" "$service_context"
            done
          done
