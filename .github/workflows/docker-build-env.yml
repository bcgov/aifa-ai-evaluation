name: Build Docker image with baked .env

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build (no env baking)
        run: |
          echo "Building image without baking .env into the image. Set secrets in App Service or Key Vault."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry (optional)
        if: false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE_NAME="${{ github.repository }}:latest"
          echo "Building $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" -f Dockerfile .
          echo "Built image: $IMAGE_NAME"

      # GHCR build/push is handled in a separate job below when ACR is not configured.

      - name: Push image to Azure Container Registry (optional)
        if: ${{ env.ACR_NAME != '' }}
        env:
          IMAGE_NAME: ${{ github.repository }}:latest
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          echo "Logging into ACR: $ACR_NAME"
          az acr login --name "$ACR_NAME"
          ACR_REPO="$ACR_NAME.azurecr.io/${{ github.repository }}:latest"
          docker tag "$IMAGE_NAME" "$ACR_REPO"
          docker push "$ACR_REPO"
          echo "Pushed $ACR_REPO"

  ghcr_build:
    name: Build & Push to GHCR (fallback)
    needs: build
    if: ${{ secrets.ACR_NAME == '' }}
    uses: ./.github/workflows/.builds.yml
    with:
      tags: |
        latest
