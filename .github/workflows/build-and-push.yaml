name: Build and push images

on:
  push:
    branches: ["main", "master"]

env:
  REGISTRY_PRIMARY: ${{ secrets.ACR_LOGIN_SERVER }}
  REGISTRY_FALLBACK: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to primary ACR (if provided)
        if: secrets.ACR_LOGIN_SERVER != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend to ACR
        if: secrets.ACR_LOGIN_SERVER != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/aifa-ai-eval-backend:latest

      - name: Build and push backend to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aifa-ai-eval-backend:latest

      - name: Build and push promptfoo to ACR
        if: secrets.ACR_LOGIN_SERVER != ''
        uses: docker/build-push-action@v5
        with:
          context: promptfoo
          file: promptfoo/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/aifa-promptfoo-runner:latest

      - name: Build and push promptfoo to GHCR
        uses: docker/build-push-action@v5
        with:
          context: promptfoo
          file: promptfoo/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aifa-promptfoo-runner:latest

      - name: Build and push frontend to ACR
        if: secrets.ACR_LOGIN_SERVER != ''
        uses: docker/build-push-action@v5
        with:
          context: frontend-common
          file: frontend-common/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/aifa-frontend:latest

      - name: Build and push frontend to GHCR
        uses: docker/build-push-action@v5
        with:
          context: frontend-common
          file: frontend-common/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aifa-frontend:latest
