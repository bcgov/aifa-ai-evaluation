name: Deploy to ACA

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run "plan" to preview, or "apply" to deploy'
        required: false
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  packages: write

concurrency:
  group: aca-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-slug:
    name: Branch Slug
    runs-on: ubuntu-24.04
    outputs:
      branch_slug: ${{ steps.slug.outputs.branch_slug }}
    steps:
      - name: Compute branch slug
        id: slug
        shell: bash
        run: |
          branch="${{ github.ref_name }}"
          slug=$(echo "$branch" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          slug="${slug:0:15}"
          slug=$(echo "$slug" | sed 's/-$//')
          echo "branch_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Branch slug: $slug"

  builds:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.command == 'apply'
    concurrency:
      group: builds-aca-${{ github.run_id }}
      cancel-in-progress: true
    uses: ./.github/workflows/.builds.yml
    with:
      tags: |
        latest
        sha-${{ github.sha }}
        run-${{ github.run_id }}

  deploy:
    name: ${{ inputs.command == 'plan' && 'Plan' || 'Deploy' }} ACA
    needs: [builds, branch-slug]
    if: always() && (needs.builds.result == 'success' || needs.builds.result == 'skipped')
    environment: dev
    runs-on: ubuntu-latest
    env:
      AZURE_CONTAINER_REGISTRY: ${{ vars.ACR_NAME || 'aifaevaldevacr' }}
      GHCR_IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
      GHCR_IMAGE_TAG: sha-${{ github.sha }}
      IMAGE_TAG: sha-${{ github.sha }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP || secrets.TF_STATE_RESOURCE_GROUP || 'rg-aifa-ai-evaluation-tfstate' }}
      TF_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME || secrets.TF_STATE_STORAGE_ACCOUNT_NAME }}
      TF_STATE_CONTAINER_NAME: ${{ vars.TF_STATE_CONTAINER_NAME || secrets.TF_STATE_CONTAINER_NAME || 'tfstate' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || secrets.TF_STATE_KEY || 'aifa-ai-evaluation/aca.tfstate' }}
      TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_STATE_USE_AZUREAD_AUTH: "true"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      TF_VAR_resource_group_name: ${{ vars.ACA_RESOURCE_GROUP || secrets.ACA_RESOURCE_GROUP || 'nr-ai-form-dev' }}
      TF_VAR_environment_name: ${{ vars.ACA_ENVIRONMENT_NAME || secrets.ACA_ENVIRONMENT_NAME || 'nraif-671b-dev-dev-containerenv' }}
      TF_VAR_container_registry_enabled: false
      TF_VAR_container_registry_name: ""
      TF_VAR_image_registry: ghcr.io/${{ github.repository }}
      TF_VAR_pyrit_image_name: aifa-ai-evaluation-pyrit
      TF_VAR_frontend_image_name: aifa-ai-evaluation-frontend
      TF_VAR_promptfoo_image_name: aifa-ai-evaluation-promptfoo
      TF_VAR_image_tag: sha-${{ github.sha }}
      TF_VAR_registry_server: ghcr.io
      TF_VAR_registry_username: ${{ github.actor }}
      TF_VAR_registry_password: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_container_app_name: ${{ vars.ACA_CONTAINER_APP_NAME || 'ca-aifa-ai-evaluation-dev' }}
      TF_VAR_app_env: ${{ vars.APP_ENV || 'dev' }}
      TF_VAR_backend_api_url: ${{ vars.BACKEND_API_URL || secrets.BACKEND_API_URL || 'http://localhost:8000' }}
      TF_VAR_backend_api_timeout: ${{ vars.BACKEND_API_TIMEOUT || '30' }}
      TF_VAR_promptfoo_run_token: ${{ secrets.PROMPTFOO_RUN_TOKEN }}
      TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      TF_VAR_azure_openai_endpoint: ${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}
      TF_VAR_azure_openai_api_version: ${{ vars.AZURE_OPENAI_API_VERSION || '2025-01-01-preview' }}
      TF_VAR_azure_openai_deployment: ${{ vars.AZURE_OPENAI_DEPLOYMENT || secrets.AZURE_OPENAI_DEPLOYMENT }}
      TF_VAR_adversarial_openai_api_key: ${{ secrets.ADVERSARIAL_OPENAI_API_KEY }}
      TF_VAR_adversarial_openai_endpoint: ${{ vars.ADVERSARIAL_OPENAI_ENDPOINT || secrets.ADVERSARIAL_OPENAI_ENDPOINT }}
      TF_VAR_adversarial_openai_deployment: ${{ vars.ADVERSARIAL_OPENAI_DEPLOYMENT || secrets.ADVERSARIAL_OPENAI_DEPLOYMENT }}
      TF_VAR_azure_storage_connection_string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      TF_VAR_azure_storage_container_name: ${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'aifa-reports' }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: infra/aca
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${TF_STATE_STORAGE_ACCOUNT_NAME:-}" ]]; then
            echo "Using Azure Storage remote state backend."

            if [[ "${TF_STATE_USE_AZUREAD_AUTH:-true}" == "true" ]]; then
              echo "Using Azure AD/OIDC auth for remote state backend."
              terraform init \
                -reconfigure \
                -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
                -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT_NAME}" \
                -backend-config="container_name=${TF_STATE_CONTAINER_NAME}" \
                -backend-config="key=${TF_STATE_KEY}" \
                -backend-config="use_azuread_auth=true"
            elif [[ -n "${TF_STATE_ACCESS_KEY:-}" ]]; then
              echo "Using storage account access key for remote state backend."
              terraform init \
                -reconfigure \
                -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
                -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT_NAME}" \
                -backend-config="container_name=${TF_STATE_CONTAINER_NAME}" \
                -backend-config="key=${TF_STATE_KEY}" \
                -backend-config="access_key=${TF_STATE_ACCESS_KEY}"
            else
              echo "Remote state storage was configured without a usable auth method; falling back to local state."
              terraform init -backend=false -reconfigure
            fi
          else
            echo "Remote Terraform backend secrets are missing; falling back to local state for this run."
            terraform init -backend=false -reconfigure
          fi

      - name: Adopt existing Azure resources if present
        working-directory: infra/aca
        shell: bash
        run: |
          set -euo pipefail
          RG_NAME="${TF_VAR_resource_group_name:-rg-aifa-ai-evaluation-aca-dev}"
          ENV_NAME="${TF_VAR_environment_name:-cae-aifa-ai-evaluation-dev}"
          APP_NAME="${TF_VAR_container_app_name:-ca-aifa-ai-evaluation-dev}"

          if az group exists --name "$RG_NAME" >/tmp/rg_exists.json; then
            if [ "$(cat /tmp/rg_exists.json)" = "true" ]; then
              RG_ID="$(az group show --name "$RG_NAME" --query id -o tsv)"
              if ! terraform state list | grep -q '^azurerm_resource_group.main$'; then
                echo "Importing existing resource group '$RG_NAME' into Terraform state..."
                terraform import azurerm_resource_group.main "$RG_ID"
              else
                echo "Resource group '$RG_NAME' is already in Terraform state."
              fi

              LAW_ID="$(az monitor log-analytics workspace show -g "$RG_NAME" -n "law-${ENV_NAME//-/}" --query id -o tsv 2>/dev/null || true)"
              if [[ -n "$LAW_ID" ]]; then
                if ! terraform state list | grep -q '^azurerm_log_analytics_workspace.main$'; then
                  echo "Importing existing Log Analytics workspace for '$RG_NAME' into Terraform state..."
                  terraform import azurerm_log_analytics_workspace.main "$LAW_ID"
                else
                  echo "Log Analytics workspace is already in Terraform state."
                fi
              fi

              ENV_ID="$(az containerapp env show -g "$RG_NAME" -n "$ENV_NAME" --query id -o tsv 2>/dev/null || true)"
              if [[ -n "$ENV_ID" ]]; then
                if ! terraform state list | grep -q '^azurerm_container_app_environment.main$'; then
                  echo "Importing existing Container App environment '$ENV_NAME' into Terraform state..."
                  terraform import azurerm_container_app_environment.main "$ENV_ID"
                else
                  echo "Container App environment '$ENV_NAME' is already in Terraform state."
                fi
              fi

              APP_ID="$(az containerapp show -g "$RG_NAME" -n "$APP_NAME" --query id -o tsv 2>/dev/null || true)"
              if [[ -n "$APP_ID" ]]; then
                if ! terraform state list | grep -q '^azurerm_container_app.main$'; then
                  echo "Importing existing Container App '$APP_NAME' into Terraform state..."
                  terraform import azurerm_container_app.main "$APP_ID"
                else
                  echo "Container App '$APP_NAME' is already in Terraform state."
                fi
              fi
            else
              echo "Resource group '$RG_NAME' does not exist yet; Terraform will create it."
            fi
          else
            echo "Unable to determine whether resource group '$RG_NAME' exists; continuing."
          fi

      - name: Terraform plan
        if: inputs.command == 'plan' || github.event_name == 'push'
        working-directory: infra/aca
        run: |
          terraform plan -lock=false \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="location=${{ vars.AZURE_LOCATION || 'eastus' }}" \
            -var="resource_group_name=${{ vars.ACA_RESOURCE_GROUP || 'rg-aifa-ai-evaluation-aca-dev' }}" \
            -var="environment_name=${{ vars.ACA_ENVIRONMENT_NAME || 'cae-aifa-ai-evaluation-dev' }}" \
            -var="container_registry_enabled=false" \
            -var="container_registry_name=''" \
            -var="image_registry=ghcr.io/${{ github.repository }}" \
            -var="pyrit_image_name=aifa-ai-evaluation-pyrit" \
            -var="frontend_image_name=aifa-ai-evaluation-frontend" \
            -var="promptfoo_image_name=aifa-ai-evaluation-promptfoo" \
            -var="image_tag=sha-${{ github.sha }}" \
            -var="registry_server=ghcr.io" \
            -var="registry_username=${{ github.actor }}" \
            -var="registry_password=${{ secrets.GITHUB_TOKEN }}" \
            -var="container_app_name=${{ vars.ACA_CONTAINER_APP_NAME || 'ca-aifa-ai-evaluation-dev' }}" \
            -var="app_env=${{ vars.APP_ENV || 'dev' }}" \
            -var="backend_api_url=${{ vars.BACKEND_API_URL || secrets.BACKEND_API_URL || 'http://localhost:8000' }}" \
            -var="backend_api_timeout=${{ vars.BACKEND_API_TIMEOUT || '30' }}" \
            -var="promptfoo_run_token=${{ secrets.PROMPTFOO_RUN_TOKEN }}" \
            -var="azure_openai_api_key=${{ secrets.AZURE_OPENAI_API_KEY }}" \
            -var="azure_openai_endpoint=${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}" \
            -var="azure_openai_api_version=${{ vars.AZURE_OPENAI_API_VERSION || '2025-01-01-preview' }}" \
            -var="azure_openai_deployment=${{ vars.AZURE_OPENAI_DEPLOYMENT || secrets.AZURE_OPENAI_DEPLOYMENT }}" \
            -var="adversarial_openai_api_key=${{ secrets.ADVERSARIAL_OPENAI_API_KEY }}" \
            -var="adversarial_openai_endpoint=${{ vars.ADVERSARIAL_OPENAI_ENDPOINT || secrets.ADVERSARIAL_OPENAI_ENDPOINT }}" \
            -var="adversarial_openai_deployment=${{ vars.ADVERSARIAL_OPENAI_DEPLOYMENT || secrets.ADVERSARIAL_OPENAI_DEPLOYMENT }}" \
            -var="azure_storage_connection_string=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            -var="azure_storage_container_name=${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'aifa-reports' }}"

      - name: Terraform apply
        if: inputs.command == 'apply'
        working-directory: infra/aca
        run: |
          terraform apply -auto-approve -lock=false \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="location=${{ vars.AZURE_LOCATION || 'eastus' }}" \
            -var="resource_group_name=${{ vars.ACA_RESOURCE_GROUP || 'rg-aifa-ai-evaluation-aca-dev' }}" \
            -var="environment_name=${{ vars.ACA_ENVIRONMENT_NAME || 'cae-aifa-ai-evaluation-dev' }}" \
            -var="container_registry_enabled=false" \
            -var="container_registry_name=''" \
            -var="image_registry=ghcr.io/${{ github.repository }}" \
            -var="pyrit_image_name=aifa-ai-evaluation-pyrit" \
            -var="frontend_image_name=aifa-ai-evaluation-frontend" \
            -var="promptfoo_image_name=aifa-ai-evaluation-promptfoo" \
            -var="image_tag=sha-${{ github.sha }}" \
            -var="registry_server=ghcr.io" \
            -var="registry_username=${{ github.actor }}" \
            -var="registry_password=${{ secrets.GITHUB_TOKEN }}" \
            -var="container_app_name=${{ vars.ACA_CONTAINER_APP_NAME || 'ca-aifa-ai-evaluation-dev' }}" \
            -var="app_env=${{ vars.APP_ENV || 'dev' }}" \
            -var="backend_api_url=${{ vars.BACKEND_API_URL || secrets.BACKEND_API_URL || 'http://localhost:8000' }}" \
            -var="backend_api_timeout=${{ vars.BACKEND_API_TIMEOUT || '30' }}" \
            -var="promptfoo_run_token=${{ secrets.PROMPTFOO_RUN_TOKEN }}" \
            -var="azure_openai_api_key=${{ secrets.AZURE_OPENAI_API_KEY }}" \
            -var="azure_openai_endpoint=${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}" \
            -var="azure_openai_api_version=${{ vars.AZURE_OPENAI_API_VERSION || '2025-01-01-preview' }}" \
            -var="azure_openai_deployment=${{ vars.AZURE_OPENAI_DEPLOYMENT || secrets.AZURE_OPENAI_DEPLOYMENT }}" \
            -var="adversarial_openai_api_key=${{ secrets.ADVERSARIAL_OPENAI_API_KEY }}" \
            -var="adversarial_openai_endpoint=${{ vars.ADVERSARIAL_OPENAI_ENDPOINT || secrets.ADVERSARIAL_OPENAI_ENDPOINT }}" \
            -var="adversarial_openai_deployment=${{ vars.ADVERSARIAL_OPENAI_DEPLOYMENT || secrets.ADVERSARIAL_OPENAI_DEPLOYMENT }}" \
            -var="azure_storage_connection_string=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            -var="azure_storage_container_name=${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'aifa-reports' }}"
