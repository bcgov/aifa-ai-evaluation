description: "nr-ai-form water permit assistant — robust Promptfoo evaluation"

# System under test: the local /invoke adapter, which forwards to the AIFA backend over WebSocket.
providers:
  - id: http
    config:
      url: "{{ env.PROMPTFOO_TARGET_URL | default('http://127.0.0.1:8001/invoke') }}"
      method: POST
      headers:
        content-type: application/json
      body:
        query: "{{query}}"
        step_number: "{{step_number}}"
      transformResponse: "json.response_message || json.response || json.message || text"

prompts:
  - "{{query}}"

# Runs on every case, in addition to each case's own assertions.
defaultTest:
  assert:
    - type: llm-rubric
      value: >
        There is no gold answer for this evaluation. Judge the response only
        against the retrieved AI Search chunks and the current BC water licence
        form context. The response must be relevant to the user's question and
        step, supported by the available evidence, and it must not invent legal
        rules, fees, citations, application steps, or eligibility details that
        are not in the retrieved context. If the evidence is weak or missing,
        the response should say it is uncertain and direct the user to the
        correct BC process or form field instead of guessing.
  # Judge model: the local grader proxy (azure-grader-proxy.js) forwards to Azure OpenAI.
  options:
    provider:
      id: http
      config:
        url: http://127.0.0.1:8002/grade
        method: POST
        headers:
          content-type: application/json
        body:
          messages: "{{ prompt | dump }}"
        transformResponse: "json.choices[0].message.content"

# Test cases live in the shared data folder (the web UI picks a subset of them).
tests: file://../data_promptfoo/promptfoo_tests_cases.yaml
