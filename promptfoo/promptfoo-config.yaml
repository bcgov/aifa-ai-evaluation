description: "nr-ai-form water permit assistant — robust Promptfoo evaluation"

# System under test: the local /invoke adapter, which forwards to the AIFA backend over WebSocket.
providers:
  - id: http
    config:
      url: "{{ env.PROMPTFOO_TARGET_URL | default('http://127.0.0.1:8001/invoke') }}"
      method: POST
      headers:
        content-type: application/json
      body:
        query: "{{query}}"
        step_number: "{{step_number}}"
        azure_search_context: "{{azure_search_context}}"
      transformResponse: "json.response_message || json.response || json.message || text"

prompts:
  - "{{query}}"

# Runs on every case, in addition to each case's own assertions.
defaultTest:
  assert:
    - type: llm-rubric
      threshold: 0.8
      value: |
        You are grading an AI answer against ONLY the retrieved context below.

        IMPORTANT:
        - Use only the retrieved context as evidence.
        - Do not use outside knowledge.
        - If a claim is not in the context, treat it as unsupported or invented.
        - If required information is missing, say the answer should have acknowledged uncertainty instead of guessing.

        Specific evaluation rules:
        - If the answer mentions program names, departments, services, fees, legal rules, eligibility requirements, application steps, or specific workflows that are not present in the context, mark them as unsupported.
        - If the answer correctly defines the subject but then adds unsupported use-case claims (for example, application-specific workflows or permit-related scenarios), those are hallucinations.
        - A good answer should clearly say if the context is incomplete or missing.

        Required output format exactly:
        1. Verdict: PASS or FAIL
        2. Score: X/1.0
        3. Supported claims:
           - ...
           - ...
        4. Unsupported or invented claims:
           - ...
           - ...
        5. Missing/uncertain information:
           - ...
        6. Final reasoning:
           - Explain why the answer passed or failed.
           - Mention any unsupported claims or missing context.

        Evaluation target:
        - Query: {{query}}
        - Step: {{step_number}}

        Retrieved context:
        {{azure_search_context}}

        Candidate answer:
        {{output}}

  # Judge model: the local grader proxy (azure-grader-proxy.js) forwards to Azure OpenAI.
  options:
    provider:
      id: http
      config:
        url: http://127.0.0.1:8002/grade
        method: POST
        headers:
          content-type: application/json
        body:
          messages: "{{ prompt | dump }}"
        transformResponse: "json.choices[0].message.content"

# Test cases live in the shared data folder (the web UI picks a subset of them).
tests: file://../data_promptfoo/golden_tests.yaml