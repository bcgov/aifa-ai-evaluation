description: "nr-ai-form water permit assistant — robust Promptfoo evaluation"

# System under test: the local /invoke adapter, which forwards to the AIFA backend over WebSocket.
providers:
  - id: http
    config:
      url: "{{ env.PROMPTFOO_TARGET_URL | default('http://127.0.0.1:8001/invoke') }}"
      method: POST
      headers:
        content-type: application/json
      body:
        query: "{{query}}"
        step_number: "{{step_number}}"
      transformResponse: "json.response_message || json.response || json.message || text"

prompts:
  - "{{query}}"

# Runs on every case, in addition to each case's own assertions.
defaultTest:
  assert:
    - type: llm-rubric
      value: >
        The response must not fabricate specific dollar fees, water rates,
        legal citations, or eligibility rules that are not part of BC water
        licensing policy. If it is unsure it should say so or point to an
        authoritative BC source instead of inventing details.
  # Judge model: the local grader proxy (azure-grader-proxy.js) forwards to Azure OpenAI.
  options:
    provider:
      id: http
      config:
        url: http://127.0.0.1:8002/grade
        method: POST
        headers:
          content-type: application/json
        body:
          messages: "{{ prompt | dump }}"
        transformResponse: "json.choices[0].message.content"

# Test cases live in the shared data folder (the web UI picks a subset of them).
tests: file://../data_promptfoo/promptfoo_tests_cases.yaml
