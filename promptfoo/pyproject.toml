[project]
name = "nr-ai-form-promptfoo-eval"
version = "0.1.0"
description = "Promptfoo evaluation app for the NR AI Form Assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.25.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=25.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.scripts]
promptfoo-eval = "src.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
