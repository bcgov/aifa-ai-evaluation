- description: case-session-de1162f2d558950d058760ecfb4ec177 [shared-multifile-upload]
  vars:
    query: How do I upload my map
    step_number: shared-multifile-upload
    azure_search_context: 'FAQ: What if My Number of Livestock Changes

      Each Year? Will My Annual Fees Change?


      Question

      What should I do if my number of livestock changes each year? Will my annual
      fees change?


      Answer

      When completing your water licence application, enter your best estimate of
      the number of

      livestock and the amount of water you expect to require based on your normal
      or planned

      operation.


      If your livestock numbers vary from year to year, estimate your water quantity
      using your expected

      livestock numbers for a typical year.


      Your annual water rentals and charges are not automatically based on the actual
      number of

      livestock each year. Fees, rentals, and charges are determined according to
      your authorized

      water use and the applicable provisions of the Water Sustainability Fees, Rentals
      and Charges

      Tariff Regulation.


      If you have questions about how annual fees, rentals, or charges are calculated,
      refer to the

      regulation below.


      Reference


      Water Sustainability Fees, Rentals and Charges Tariff Regulation

      https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/37_2016


      Important

      When completing your application, always provide your best estimate of your
      livestock numbers

      and water requirements based on your expected operation.'
    chat_response: 'To upload your map file in this part of the form:


      1. Make sure your map is already saved on your device as a file (for example,
      a PDF, image, or document).

      2. Click the **Add files** button to open your device’s file picker.

      3. In the file picker, select your map file (you can choose more than one if
      needed), then confirm so it appears in the upload queue.

      4. In the queue, you’ll see a row with the filename, status, size, and a **Description**
      box. If you wish, type a brief description of the map in that per-file Description
      field.

      5. When your file is listed in the queue, click the **Start upload** button
      to upload it.


      If no files are queued, the area will show “Drag files here” with total status
      0% and size 0 b, and **Start upload** may be disabled.


      Always select files, enter descriptions, and start uploads directly in this
      form yourself. Do not share personal information, signatures, file contents,
      addresses, phone numbers, emails, or client details with AIFA-AI Form Assist.'
