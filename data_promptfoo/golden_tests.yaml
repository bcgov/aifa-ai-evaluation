  vars:
    query: What is BCeID?
    step_number: step2-Eligibility
    azure_search_context: "What is BCeID? \n\nFollowing sections cover BCeID and its\
      \ features \n\nBC Electronic Identity (BCeID) \n\n1. Introduction \n\nBC Electronic\
      \ Identity (BCeID) is a secure online authentication service provided by \n\n\
      the Government of British Columbia (BC), Canada. It enables individuals and\
      \ businesses \n\nto access a wide range of participating provincial government\
      \ services using a single set \n\nof login credentials. \n\n2. Types of BCeID\
      \ Accounts \n\nBCeID provides different account types depending on user needs:\
      \ \n\n• Basic BCeID – For individuals accessing services that do not require\
      \ business verification. \n\n• Business BCeID – For organizations such as companies,\
      \ partnerships, and non-profits. \n\n• (Note: Personal BCeID has been retired.)\
      \ \n\n3. How BCeID Works \n\n1. Register online by selecting the appropriate\
      \ account type. \n\n2. Complete identity verification if required (especially\
      \ for Business accounts). \n\n3. Use your username and password to log in to\
      \ participating government services. \n\n4. Key Benefits \n\n• Single Credential\
      \ Access – One login for multiple services. \n• Secure Authentication – Government-managed\
      \ security standards. \n• Privacy Protection – Operates under BC government\
      \ privacy policies. \n• Wide Adoption – Used by many provincial government services.\
      \  \n\n5. Support Information \n\nFor assistance with login issues, password\
      \ resets, or account management: \n\nService BC Help Desk \n\nToll-free (Canada\
      \ & USA): 1-888-356-2741 \n\nLocal: 604-660-2355  \n\n\n\nMore information available\
      \ on Official Website: https://www.bceid.ca/"
    chat_response: "BCeID (BC Electronic Identity) is a secure online authentication\
      \ service provided by the Government of British Columbia. It lets individuals,\
      \ businesses, and organizations access many provincial government online services\
      \ using a single username and password.  \n\nKey points from the guidance: \
      \ \n- It’s managed by the Identity Services program in Service BC.  \n- It provides\
      \ a centralized, consistent way to verify identity for access to government\
      \ services.  \n- There are different account types (e.g., Basic and Business\
      \ BCeID).  \n- It’s used for services like the BC water permit application to\
      \ let you sign in, save, and return to your application later.  \n\nYou can\
      \ learn more or register at: https://www.bceid.ca/"
