- description: case-session-e07f92b51b899d241f70795d3931ba97 [step10-Complete]
  vars:
    query: i want to submit the application to the Surrey office
    step_number: step10-Complete
    azure_search_context: 'FAQ: Co-Applicant Approval Process


      Question

      What are the supported options for requesting approval from a co-applicant?


      Answer

      There are two supported options:


      • Request via email: Use the email request option to send the co-applicant an
      approval request.

      • Hand deliver the approval form: Provide the Co-Applicant Approval Form or
      Application

      Form so the co-applicant can review and sign outside the online email process.


      Uploading a signed form or selecting the mail option are ways to submit a completed
      approval form

      after it has been signed. They are not separate methods for requesting approval.


      Question

      In the hand delivery or offline approval flow, does the co-applicant send the
      signed approval form

      back to the primary applicant?


      Answer

      Yes. The co-applicant signs the approval form and returns it to the primary
      applicant. The primary

      applicant is responsible for uploading or submitting the signed Co-Applicant
      Approval Form.


      Question

      What documents should the primary applicant provide to the co-applicant for
      offline approval?


      Answer

      Provide the Co-Applicant Approval Form, the Application Form, and any uploaded
      documents

      that describe the application so the co-applicant can review them before signing.


      Question

      Why are the Application Form, Co-Applicant Approval Form, and attached documents
      shown in the

      hand delivery section?


      Answer

      These documents identify what the primary applicant should provide to the co-applicant
      for review.

      If approval is requested by email, the same materials are made available through
      the email review

      process.


      Question

      If I choose Upload Signed Form or Mail Approval Form, do I need to submit all
      documents or only

      the signed Co-Applicant Approval Form?


      Answer

      Only upload or mail the signed Co-Applicant Approval Form. The Application Form
      and attached

      documents are provided for review and do not need to be submitted again.'
