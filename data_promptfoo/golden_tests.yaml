- description: case-session-e07f92b51b899d241f70795d3931ba97 [step5-Document-Upload]
  vars:
    query: i have a Drawing to Scale document to upload
    step_number: step5-Document-Upload
    azure_search_context: "If your works affects other land: \n\nIf your application\
      \ for a licence is granted you are strongly encouraged to obtain access to \n\
      the land in question by negotiating with the affected landowner to obtain an\
      \ easement. As \nan interim measure prior to obtaining the easement you may\
      \ also complete a written \nagreement with the affected landowner. If you have\
      \ already negotiated an easement, or \nhave a written agreement, you can upload\
      \ a copy of the agreement in the ‘Document \nUpload’ section of the application.\
      \ \n \nIf you are unable to negotiate an easement agreement you may also \n\
      investigate expropriation of the land. As a water licence holder, you have the\
      \ right to \nexpropriate any privately owned land, beyond the boundaries of\
      \ your own land, that is \nreasonably required to access your water right and\
      \ to protect your water source from \npollution. Visit for more information:\
      \ \n\nhttp://www2.gov.bc.ca/gov/content/environment/air-land-water/water/water-licensing-rights/water-licences-approvals/expropriation"
    chat_response: 'You can upload your “Drawing to Scale” on the Step 5 document
      upload page as a supporting file for your Water Licence Application. This drawing
      is mandatory and must meet the Water Application Drawing Standards.


      Your Drawing to Scale must:


      - Use a clear, consistent scale (for example, 1 cm = 50 m or 1:5000).

      - Show a north arrow.

      - Include coordinates for the centre of the drawing (e.g., latitude/longitude
      or UTM).


      It should clearly show:


      - The water source location and its name/type (stream, well, etc.), including
      direction of flow.

      - Property boundaries where water will be used.

      - All land parcels (private and Crown) that will be crossed, flooded, or used
      for access.

      - Any reservoir locations and whether they are natural or man-made.

      - The actual place(s) of use (house, barn, pasture, irrigation fields, etc.).

      - Any areas that will be flooded.

      - The intake/diversion structure or well location.

      - Irrigation areas, if applicable.

      - All existing and proposed works (pipelines, pumps, ponds, reservoirs, irrigation
      systems).


      Accepted formats include:


      - Digital maps (PDF or spatial files) such as those created with iMapBC, Google
      Earth (KML/KMZ), or other GIS formats (shapefiles, GeoJSON).

      - Hand-drawn sketches, as long as they are clear and include scale, north arrow,
      and coordinates.

      - Existing base maps such as Regional District Composite Maps, Surveyor’s Certificates,
      or Legal Survey Plans.


      When uploading on Step 5:


      - Make sure the file is not a ZIP file.

      - Ensure the file size is no larger than 50MB.

      - Upload the drawing as its own file using the file upload button on the Step
      5 page.


      Applications may be returned if the drawing does not meet the required standards.
      For full details and examples, you can review the Water Application Drawing
      Standards (2016) here: [Water Application Drawing Standards (2016)](https://www2.gov.bc.ca/assets/gov/environment/air-land-water/water/water-licensing-and-rights/new_drawing_standards_final_2016.pdf).'
